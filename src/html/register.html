<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Decentralized Voting</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" type="text/css" href="../css/login.css">
</head>

<body>
    <div class="overlay"></div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fa-solid fa-landmark"></i>
                <span data-i18n="nav.brand">Election Commission Of INDIA</span>
            </div>
            <div class="nav-items">
                <button id="langToggle" class="nav-link-btn" onclick="toggleLanguage()">
                    🇮🇳 हिन्दी
                </button>
                <div class="nav-user">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Secure Registration</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="login-container">
            <div class="login-header">
                <h2 data-i18n="register.title">Voter Registration</h2>
                <p data-i18n="register.subtitle">Join the secure blockchain voting network</p>
            </div>

            <form id="registerForm">
                <!-- Error/Success Message Container -->
                <div id="messageBox" class="error-message" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="messageText"></span>
                </div>

                <div class="form-group">
                    <label for="voter-id"><i class="fa-solid fa-id-card"></i> <span data-i18n="label.voterId">Voter ID</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="voter-id" name="voter-id" placeholder="Create a Voter ID" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> <span data-i18n="label.email">Email Address</span></label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>



                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> <span data-i18n="label.password">Password</span></label>
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password"><i class="fa-solid fa-lock"></i> <span data-i18n="label.confirmPassword">Confirm Password</span></label>
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="confirm-password" name="confirm-password"
                            placeholder="Confirm your password" required>
                        <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="registerBtn">
                    <span class="btn-text" data-i18n="btn.register">Register Now</span>
                    <i class="fa-solid fa-user-plus btn-icon"></i>
                    <span class="btn-loader" style="display: none;">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                    </span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <p style="color: var(--text-muted);">Already have an account? <a href="login.html" data-i18n="link.login"
                        style="color: var(--primary-light); text-decoration: none; font-weight: 600;">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="../js/register.js"></script>
    <!-- <script src="../dist/register.bundle.js"></script> -->
    <script src="../js/language.js"></script>
</body>

</html>
